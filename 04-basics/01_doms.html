<!-- DOM = Document Object Model -->
<!-- Simple words mein: DOM ek aisa system hai jo HTML page ko JavaScript ke liye ek object/tree structure mein convert karta hai, jisse JavaScript HTML ke elements ko access, change, add, ya delete kar sakti hai. 
 DOM
│
├── document
│
├── SELECT
│   ├── getElementById()
│   ├── getElementsByClassName()
│   ├── getElementsByTagName()
│   ├── querySelector()
│   └── querySelectorAll()
│
├── CONTENT
│   ├── textContent
│   ├── innerText
│   └── innerHTML
│
├── ATTRIBUTE
│   ├── getAttribute()
│   ├── setAttribute()
│   └── removeAttribute()
│
├── CLASS
│   └── classList
│       ├── add()
│       ├── remove()
│       ├── toggle()
│       └── contains()
│
├── STYLE
│   └── element.style
│
├── CREATE
│   ├── createElement()
│   ├── append()
│   └── appendChild()
│
├── REMOVE
│   └── remove()
│
├── TRAVERSAL
│   ├── parentElement
│   ├── children
│   ├── firstElementChild
│   ├── lastElementChild
│   └── nextElementSibling
│
└── EVENTS
    ├── addEventListener()
    ├── click
    ├── input
    ├── submit
    ├── keydown
    ├── keyup
    ├── bubbling
    ├── capturing
    └── delegation

-->
