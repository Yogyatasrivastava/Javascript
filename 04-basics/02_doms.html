<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create new elcment in DOM</title>
</head>
<body style="background-color:black; color: beige ;">
     <div class = "parent">
        <div class = "day">Monday</div>
        <div class = "day">Tuesday</div>
        <div class = "day">Wednesday</div>
        <div class = "day">Thursday</div>
     </div>
</body>
<script>
    const parent = document.querySelector('.parent')
    console.log(parent);
    console.log(parent.children[1])
    console.log(parent.children[1].innerHTML) // tuesday
    
     for(let i = 0; i<parent.children.length;i++){  
        console.log(parent.children[i].innerHTML)
    }
    parent.children[1].style.color = "pink" 
    console.log(parent.firstElementChild) // monday

    const dayone = document.querySelector('.day')
    console.log(dayone); // monday
    console.log(dayone.parentElement); 
    console.log(dayone.nextElementSibling);

    

    
    


    
</script>
